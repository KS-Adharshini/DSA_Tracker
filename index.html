<!doctype html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('error', function(e) {
        fetch('/__log_error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'error',
            message: e.message,
            source: e.filename,
            lineno: e.lineno,
            colno: e.colno,
            stack: e.error ? e.error.stack : null
          })
        });
      });
      window.addEventListener('unhandledrejection', function(e) {
        fetch('/__log_error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'rejection',
            message: e.reason ? e.reason.message : 'Unhandled rejection',
            stack: e.reason && e.reason.stack ? e.reason.stack : null
          })
        });
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Placement preparation tracker for DSA, aptitude, core subjects, interviews, and mock tests." />
    <title>Placement Preparation Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
